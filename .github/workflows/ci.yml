name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: rustup component add rustfmt clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features

      - name: Test
        run: cargo test --release --all

      # The gradient is the part most likely to break silently, so the smoke
      # test asserts a real fit still converges rather than merely compiling.
      - name: Smoke test a fit
        run: |
          cargo run --release --bin fit -- --tris 32 --iters 200 --size 96 --quiet
          test -f out/fit.png
          test -f out/scene.json
          test -f out/loss.csv

  wasm:
    name: WebAssembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install wasm toolchain
        run: |
          rustup target add wasm32-unknown-unknown
          curl -sSfL https://rustwasm.github.io/wasm-pack/installer/init.sh | sh

      - name: Build wasm package
        run: wasm-pack build crates/diffrast-wasm --target web --out-dir ../../web/pkg

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r python/requirements.txt

      - name: Lint
        run: python -m compileall -q python

      - name: Test
        run: python -m unittest discover -s python -p "test_*.py" -v
