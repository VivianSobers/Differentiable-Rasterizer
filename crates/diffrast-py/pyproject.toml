[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "diffrast-rs"
version = "0.1.0"
description = "Differentiable 2D rasterizer as a PyTorch-compatible operation"
requires-python = ">=3.9"
classifiers = ["Programming Language :: Rust"]

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "diffrast_rs"
