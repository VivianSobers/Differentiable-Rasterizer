[package]
name = "diffrast-py"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Python bindings exposing the rasterizer as a differentiable layer"

[lib]
name = "diffrast_rs"
crate-type = ["cdylib"]

[dependencies]
diffrast = { path = "../diffrast" }
diffrast-gpu = { path = "../diffrast-gpu" }
pyo3 = { version = "0.29", features = ["extension-module"] }
numpy = "0.29"
rayon = "1.10"
